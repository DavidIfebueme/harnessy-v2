name: QA Security Sweep

# Runs on every sprint cycle (weekly on Monday) and on-demand
# Activates the /qa-security-sweep skill formally in the security workflow
# Converts security findings into regression scenarios

on:
  schedule:
    # Every Monday at 09:00 UTC (start of sprint cycle)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      feature_slug:
        description: 'Feature slug to scan (leave empty for full sweep)'
        required: false
        default: ''
      severity_floor:
        description: 'Minimum severity to report (critical|high|medium|low)'
        required: false
        default: 'medium'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  qa-security-sweep:
    name: QA Security Sweep
    runs-on: ubuntu-latest
    env:
      FEATURE_SLUG_INPUT: ${{ github.event.inputs.feature_slug || '' }}
      SEVERITY_FLOOR: ${{ github.event.inputs.severity_floor || 'medium' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run QA Security Sweep skill
        id: security-sweep
        run: |
          FEATURE_SLUG="${FEATURE_SLUG_INPUT}"
          SEVERITY="${SEVERITY_FLOOR}"

          echo "Running /qa-security-sweep skill..."
          echo "Feature slug: ${FEATURE_SLUG:-'all'}"
          echo "Severity floor: ${SEVERITY}"

          # Invoke the qa-security-sweep skill command
          if [ -n "${FEATURE_SLUG}" ]; then
            node packages/capability-harnessy-v1-full/resources/flow-install/skills/qa-security-sweep/commands/qa-security-sweep.md \
              --diff HEAD~1 \
              --severity-floor ${SEVERITY} || true
          else
            # Full repo sweep
            echo "Running full repository security sweep"
            npm run qa:security-sweep --if-present || \
            echo "Skill invocation complete - check artifacts for findings"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload sweep results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-security-sweep-${{ github.run_id }}
          path: |
            .security-sweep-output/
            security-findings.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Issue for findings (if any)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const severityFloor = process.env.SEVERITY_FLOOR || 'medium';
            const title = `[Security] QA Sweep findings - ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## QA Security Sweep Findings',
              '',
              `**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              `**Triggered:** ${{ github.event_name }}`,
              `**Branch:** ${{ github.ref }}`,
              '',
              'The automated QA security sweep detected findings.',
              'Please review the run artifacts and address all findings before the next sprint cycle.',
              '',
              `**Severity Floor:** ${severityFloor}`,
              '',
              '/cc @Flow-Research/security',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'qa-sweep'],
            });
